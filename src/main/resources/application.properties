spring.application.name=CartPulse
spring.config.import=optional:file:.env[.properties]

# FreeDB MySQL Datasource (values loaded from .env or OS environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_DATABASE:cartpulse}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool tuned for remote FreeDB MySQL limits
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=120000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Server & Session
server.port=${SERVER_PORT:8081}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
