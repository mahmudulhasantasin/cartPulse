services:
  - type: web
    name: cartpulse-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        value: sql.freedb.tech
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:*
